<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Operating System Support</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    th {
      background: #222;
      color: white;
      text-align: left;
      padding: 14px;
    }

    td {
      padding: 14px;
      border-bottom: 1px solid #ddd;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .unsupported {
      color: #b42318;
      font-weight: bold;
    }

    .loading {
      padding: 20px;
      text-align: center;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Operating System Support</h1>

  <div class="subtitle">
    Current supported operating system versions
  </div>

  <table id="os-table">

    <thead>
      <tr>
        <th>Operating System</th>
        <th>Supported Versions</th>
        <th>Previous Unsupported Version</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td colspan="3" class="loading">
          Loading support information...
        </td>
      </tr>
    </tbody>

  </table>

  <div class="footer">
  Source: <a href="https://endoflife.date" target="_blank">endoflife.date</a> — updated daily.
</div>

</div>


<script>

async function loadOSSupport() {

  try {

    const response = await fetch("os-support.json");

    if (!response.ok) {
      throw new Error("Unable to load os-support.json");
    }

    const data = await response.json();


    const order = [
      "macOS",
      "iOS",
      "Android",
      "Windows",
      "Windows Server",
      "Ubuntu",
      "Red Hat Enterprise Linux"
    ];


    const tbody = document.querySelector("#os-table tbody");

    tbody.innerHTML = "";


    for (const os of order) {

      const item = data[os];

      if (!item) continue;


let supported;

if (os === "Windows") {

  const versions = item.supported.map(version => {

    const cycle = version.version;

    // Windows 11 examples:
    // 11-26h1-e
    // 11-25h2-w
    // 11-24h2-e-lts

    let match = cycle.match(/^11-(\d+h\d)/i);

    if (match) {
      return `Windows 11 ${match[1].toUpperCase()}`;
    }

    // Windows 10 examples
    match = cycle.match(/^10-(\d+h\d)/i);

    if (match) {
      return `Windows 10 ${match[1].toUpperCase()}`;
    }

    // Older Windows 10 releases such as 1809 / 1607
    match = cycle.match(/^10-(\d{4})/);

    if (match) {
      return `Windows 10 ${match[1]}`;
    }

    return cycle;

  });

  // Remove duplicate editions/channels
  supported = [...new Set(versions)].join(", ");

} else {

  supported = item.supported
    .map(version => version.latest || version.version)
    .join(", ");

}


      const previousUnsupported =
        item.previous_unsupported?.[0]?.version || "—";


      const row = document.createElement("tr");


      row.innerHTML = `
        <td><strong>${os}</strong></td>
        <td>${supported || "—"}</td>
        <td class="unsupported">${previousUnsupported}</td>
      `;


      tbody.appendChild(row);

    }


  } catch (error) {

    console.error(error);

    document.querySelector("#os-table tbody").innerHTML = `
      <tr>
        <td colspan="3">
          Unable to load operating system support information.
        </td>
      </tr>
    `;

  }

}


loadOSSupport();

</script>


</body>
</html>

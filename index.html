<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Operating System Support
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 40px 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f5f5f7;

            color:
                #111;
        }

        .page {

            max-width: 1050px;

            margin:
                0 auto;
        }

        h1 {

            text-align: center;

            margin:
                0 0 10px;

            font-size:
                30px;
        }

        .subtitle {

            text-align: center;

            color:
                #555;

            font-size:
                14px;

            margin-bottom:
                36px;
        }

        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap:
                18px;

            align-items:
                start;
        }

        .card {

            background:
                white;

            border-radius:
                12px;

            padding:
                22px;

            box-shadow:
                0 2px 8px
                rgba(
                    0,
                    0,
                    0,
                    0.08
                );

            min-height:
                275px;
        }

        .card h2 {

            margin:
                0 0 22px;

            font-size:
                20px;
        }

        .headings {

            display: grid;

            grid-template-columns:
                18px
                minmax(0, 1fr)
                90px;

            font-size:
                10px;

            color:
                #666;

            margin-bottom:
                5px;
        }

        .headings .right {

            text-align:
                right;
        }

        .row {

            display: grid;

            grid-template-columns:
                18px
                minmax(0, 1fr)
                90px;

            align-items:
                center;

            min-height:
                38px;

            border-bottom:
                1px solid #e5e5e5;

            font-size:
                13px;
        }

        .row:last-child {

            border-bottom:
                none;
        }

        .version {

            font-weight:
                600;

            min-width:
                0;

            padding-right:
                8px;

            line-height:
                1.2;
        }

        .latest {

            text-align:
                right;

            color:
                #444;

            white-space:
                nowrap;

            font-size:
                12px;
        }

        .dot {

            width:
                8px;

            height:
                8px;

            border-radius:
                50%;

            display:
                inline-block;
        }

        .supported-dot {

            background:
                #2dbf61;
        }

        .unsupported-dot {

            background:
                #ff3b30;
        }

        .unsupported-title {

            margin-top:
                19px;

            margin-bottom:
                5px;

            font-size:
                10px;

            color:
                #666;

            text-transform:
                uppercase;

            letter-spacing:
                0.2px;
        }

        .unsupported-row {

            border-bottom:
                none;
        }

        footer {

            text-align:
                center;

            margin-top:
                40px;

            color:
                #666;

            font-size:
                11px;

            line-height:
                1.8;
        }

        footer a {

            color:
                #444;

            text-decoration:
                underline;
        }

        .loading {

            text-align:
                center;

            grid-column:
                1 / -1;

            color:
                #666;
        }

        .error {

            text-align:
                center;

            grid-column:
                1 / -1;

            color:
                #c00;
        }

        /*
            Windows has more rows,
            so allow natural height.
        */

        .windows-card {

            min-height:
                0;
        }

        /*
            Give Windows slightly smaller
            text so long edition names fit.
        */

        .windows-card .version {

            font-size:
                12px;
        }

        /*
            Tablet
        */

        @media (
            max-width: 850px
        ) {

            .grid {

                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );
            }
        }

        /*
            Phone
        */

        @media (
            max-width: 560px
        ) {

            body {

                padding:
                    25px 12px;
            }

            .grid {

                grid-template-columns:
                    1fr;
            }

            h1 {

                font-size:
                    25px;
            }
        }

    </style>

</head>

<body>

<div class="page">

    <h1>
        Operating System Support
    </h1>

    <div class="subtitle">
        Current supported operating system versions
    </div>

    <div
        id="grid"
        class="grid"
    >

        <div class="loading">
            Loading support information...
        </div>

    </div>

<footer>

    <div>
        Dynamically updated every 6 hours using

        <a
            href="https://endoflife.date"
            target="_blank"
            rel="noopener noreferrer"
        >
            endoflife.date
        </a>

        and

        <a
            href="https://support.apple.com/en-us/100100"
            target="_blank"
            rel="noopener noreferrer"
        >
            Apple Security Releases
        </a>

        as sources.
    </div>

    <div id="lastUpdated">
        Last updated: loading...
    </div>

</footer>

</div>


<script>

const DISPLAY_ORDER = [

    "macOS",
    "iOS",
    "Android",
    "Windows",
    "Windows Server",
    "Ubuntu",
    "Red Hat Enterprise Linux"

];


function createDot(
    supported
) {

    const dot =
        document.createElement(
            "span"
        );

    dot.className =
        supported
            ? "dot supported-dot"
            : "dot unsupported-dot";

    return dot;
}


function createRow(
    item,
    supported,
    operatingSystem
) {

    const row =
        document.createElement(
            "div"
        );

    row.className =
        supported
            ? "row"
            : "row unsupported-row";

    const dotHolder =
        document.createElement(
            "div"
        );

    dotHolder.appendChild(
        createDot(
            supported
        )
    );

    const version =
        document.createElement(
            "div"
        );

    version.className =
        "version";

    version.textContent =
        item.version ?? "";

    const latest =
        document.createElement(
            "div"
        );

    latest.className =
        "latest";

    /*
        Apple:
        show previous minor/security release.
    */

    if (
        (
            operatingSystem === "macOS"
            ||
            operatingSystem === "iOS"
        )
        &&
        supported
    ) {

        if (item.previous) {

            latest.textContent =
                "Previous: "
                + item.previous;

        } else {

            latest.textContent =
                "";
        }

    } else {

        latest.textContent =
            item.latest ?? "";
    }

    row.appendChild(
        dotHolder
    );

    row.appendChild(
        version
    );

    row.appendChild(
        latest
    );

    return row;
}


function createCard(
    operatingSystem,
    data
) {

    const card =
        document.createElement(
            "section"
        );

    card.className =
        "card";

    if (
        operatingSystem
        === "Windows"
    ) {

        card.classList.add(
            "windows-card"
        );
    }

    const title =
        document.createElement(
            "h2"
        );

    title.textContent =
        operatingSystem;

    card.appendChild(
        title
    );

    const headings =
        document.createElement(
            "div"
        );

    headings.className =
        "headings";

    const blank =
        document.createElement(
            "div"
        );

    const left =
        document.createElement(
            "div"
        );

    left.textContent =
        "Supported version";

    const right =
        document.createElement(
            "div"
        );

    right.className =
        "right";

    if (
        operatingSystem === "macOS"
        ||
        operatingSystem === "iOS"
    ) {

        right.textContent =
            "Previous release";

    } else {

        right.textContent =
            "Latest";
    }

    headings.appendChild(
        blank
    );

    headings.appendChild(
        left
    );

    headings.appendChild(
        right
    );

    card.appendChild(
        headings
    );

    const supported =
        data.supported || [];

    supported.forEach(
        function(item) {

            card.appendChild(
                createRow(
                    item,
                    true,
                    operatingSystem
                )
            );
        }
    );

    const unsupported =
        data.unsupported || [];

    if (
        unsupported.length > 0
    ) {

        const heading =
            document.createElement(
                "div"
            );

        heading.className =
            "unsupported-title";

        heading.textContent =
            "Previous unsupported";

        card.appendChild(
            heading
        );

        unsupported.forEach(
            function(item) {

                card.appendChild(
                    createRow(
                        item,
                        false,
                        operatingSystem
                    )
                );
            }
        );
    }

    return card;
}


function formatUpdatedTime(
    value
) {

    if (!value) {
        return "Unknown";
    }

    const date =
        new Date(
            value
        );

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;
    }

    return date.toLocaleString(
        "en-GB",
        {
            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit",

            timeZoneName:
                "short"
        }
    );
}


async function loadData() {

    const grid =
        document.getElementById(
            "grid"
        );

    try {

        const response =
            await fetch(
                "os-support.json?v="
                + Date.now(),
                {
                    cache:
                        "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP "
                + response.status
            );
        }

        const data =
            await response.json();

        grid.innerHTML =
            "";

        DISPLAY_ORDER.forEach(
            function(
                operatingSystem
            ) {

                if (
                    data[
                        operatingSystem
                    ]
                ) {

                    grid.appendChild(
                        createCard(
                            operatingSystem,
                            data[
                                operatingSystem
                            ]
                        )
                    );
                }
            }
        );

        const updated =
            document.getElementById(
                "lastUpdated"
            );

        updated.textContent =
            "Last updated: "
            + formatUpdatedTime(
                data._last_updated
            );

    } catch (error) {

        console.error(
            error
        );

        grid.innerHTML =
            "";

        const message =
            document.createElement(
                "div"
            );

        message.className =
            "error";

        message.textContent =
            "Unable to load operating system support data.";

        grid.appendChild(
            message
        );
    }
}


loadData();

</script>

</body>

</html>

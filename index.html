<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Operating System Support Dashboard</title>

    <style>

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #f5f5f7;
            color: #1d1d1f;
            margin: 0;
            padding: 40px 20px;
        }


        .container {
            max-width: 1100px;
            margin: 0 auto;
        }


        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 34px;
        }


        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }


        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 22px;
        }


        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }


        .card h2 {
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 22px;
        }


        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 20px;
            margin-bottom: 8px;
        }


        .version-row {
            display: grid;
            grid-template-columns: 18px 1fr 1fr;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #eeeeee;
            gap: 8px;
        }


        .version-row:last-child {
            border-bottom: none;
        }


        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }


        .supported-dot {
            background: #34c759;
        }


        .unsupported-dot {
            background: #ff3b30;
        }


        .version {
            font-weight: 600;
        }


        .latest {
            color: #555;
            text-align: right;
        }


        .previous {
            color: #777;
            font-size: 14px;
            text-align: right;
        }


        .column-headings {
            display: grid;
            grid-template-columns: 18px 1fr 1fr;
            gap: 8px;

            font-size: 12px;
            color: #888;

            margin-bottom: 4px;
        }


        .column-headings div:last-child {
            text-align: right;
        }


        .empty {
            color: #999;
            font-style: italic;
            padding: 8px 0;
        }


        footer {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 40px;
            line-height: 1.7;
        }


        footer a {
            color: #555;
        }


        @media (max-width: 600px) {

            body {
                padding: 25px 12px;
            }

            h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <h1>Operating System Support</h1>

    <div class="subtitle">
        Current supported operating system versions
    </div>


    <div id="dashboard" class="grid">

        Loading support data...

    </div>


    <footer>

        <div>
            Source:
            <a
                href="https://endoflife.date"
                target="_blank"
                rel="noopener noreferrer"
            >
                endoflife.date
            </a>
            —
            Apple release history:
            <a
                href="https://support.apple.com/en-us/100100"
                target="_blank"
                rel="noopener noreferrer"
            >
                Apple Security Releases
            </a>
        </div>

        <div id="last-updated">
            Last updated: loading...
        </div>

    </footer>


</div>


<script>

const DISPLAY_ORDER = [
    "macOS",
    "iOS",
    "Android",
    "Windows",
    "Windows Server",
    "Ubuntu",
    "Red Hat Enterprise Linux"
];



function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}



function formatVersion(entry, productName) {

    if (!entry) {
        return "";
    }

    /*
        macOS and iOS:
        show the actual latest minor release.

        Example:
        macOS 15 -> 15.7.1
        iOS 18 -> 18.7.1
    */

    if (
        productName === "macOS" ||
        productName === "iOS"
    ) {

        return entry.latest || entry.version || "";

    }


    /*
        Windows:
        deliberately show the friendly release
        such as 25H2 / 24H2 rather than the
        Microsoft build number.
    */

    if (productName === "Windows") {

        return entry.version || "";

    }


    /*
        Other operating systems:
        show the cycle/release name.
    */

    return entry.version || entry.latest || "";

}



function formatLatest(entry, productName) {

    if (!entry) {
        return "";
    }


    /*
        For Apple we use the second column to show
        the previous minor version.
    */

    if (
        productName === "macOS" ||
        productName === "iOS"
    ) {

        if (entry.previous) {
            return "Previous: " + entry.previous;
        }

        return "";

    }


    /*
        Windows is intentionally kept simple.
        Do not show 10.0.26100 etc.
    */

    if (productName === "Windows") {

        return "";

    }


    /*
        For other products, show the latest release
        where it adds useful information.
    */

    if (
        entry.latest &&
        entry.latest !== entry.version
    ) {

        return entry.latest;

    }

    return "";

}



function getColumnHeading(productName) {

    if (
        productName === "macOS" ||
        productName === "iOS"
    ) {

        return "Previous release";

    }


    if (productName === "Windows") {

        return "";

    }


    return "Latest";

}



function createSupportedRow(entry, productName) {

    const version =
        escapeHtml(
            formatVersion(entry, productName)
        );


    const detail =
        escapeHtml(
            formatLatest(entry, productName)
        );


    return `

        <div class="version-row">

            <span
                class="dot supported-dot"
                title="Supported"
            ></span>


            <div class="version">
                ${version}
            </div>


            <div class="latest">
                ${detail}
            </div>

        </div>

    `;

}



function createUnsupportedRow(entry, productName) {

    const version =
        escapeHtml(
            formatVersion(entry, productName)
        );


    let detail = "";


    if (
        productName !== "Windows" &&
        entry.latest &&
        entry.latest !== entry.version
    ) {

        detail =
            escapeHtml(entry.latest);

    }


    return `

        <div class="version-row">

            <span
                class="dot unsupported-dot"
                title="Unsupported"
            ></span>


            <div class="version">
                ${version}
            </div>


            <div class="latest">
                ${detail}
            </div>

        </div>

    `;

}



function createCard(productName, productData) {

    const supported =
        productData.supported || [];


    const unsupported =
        productData.previous_unsupported || [];


    let supportedHtml = "";


    if (supported.length === 0) {

        supportedHtml = `

            <div class="empty">
                No supported releases found
            </div>

        `;

    } else {

        supportedHtml =
            supported
                .map(
                    entry =>
                        createSupportedRow(
                            entry,
                            productName
                        )
                )
                .join("");

    }


    let unsupportedHtml = "";


    if (unsupported.length > 0) {

        unsupportedHtml = `

            <div class="section-title">
                Previous unsupported
            </div>

            ${unsupported
                .map(
                    entry =>
                        createUnsupportedRow(
                            entry,
                            productName
                        )
                )
                .join("")}

        `;

    }


    const columnHeading =
        getColumnHeading(productName);


    let headingsHtml = "";


    if (columnHeading) {

        headingsHtml = `

            <div class="column-headings">

                <div></div>

                <div>
                    Supported version
                </div>

                <div>
                    ${escapeHtml(columnHeading)}
                </div>

            </div>

        `;

    }


    return `

        <div class="card">

            <h2>
                ${escapeHtml(productName)}
            </h2>

            ${headingsHtml}

            ${supportedHtml}

            ${unsupportedHtml}

        </div>

    `;

}



function displayLastUpdated(timestamp) {

    const element =
        document.getElementById(
            "last-updated"
        );


    if (!timestamp) {

        element.textContent =
            "Last updated: unknown";

        return;

    }


    const date =
        new Date(timestamp);


    const formatted =
        new Intl.DateTimeFormat(
            "en-GB",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                timeZoneName: "short"
            }
        ).format(date);


    element.textContent =
        "Last updated: " + formatted;

}



async function loadDashboard() {

    const dashboard =
        document.getElementById(
            "dashboard"
        );


    try {

        /*
            Cache-busting prevents GitHub Pages /
            the browser from showing yesterday's
            os-support.json file.
        */

        const response =
            await fetch(
                "os-support.json?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load os-support.json"
            );

        }


        const data =
            await response.json();


        let html = "";


        for (
            const productName
            of DISPLAY_ORDER
        ) {

            if (!data[productName]) {
                continue;
            }


            html +=
                createCard(
                    productName,
                    data[productName]
                );

        }


        dashboard.innerHTML = html;


        displayLastUpdated(
            data._last_updated
        );


    } catch (error) {

        console.error(error);


        dashboard.innerHTML = `

            <div class="card">

                <h2>
                    Unable to load support data
                </h2>

                <div class="empty">
                    Check that os-support.json
                    exists and that the GitHub
                    Actions workflow completed
                    successfully.
                </div>

            </div>

        `;

    }

}



loadDashboard();

</script>


</body>
</html>
